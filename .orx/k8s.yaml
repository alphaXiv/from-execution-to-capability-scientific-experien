apiVersion: batch/v1
kind: Job
metadata:
  name: sciconsolidate-{{ORX_RUN}}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: run
          image: nvcr.io/nvidia/pytorch:25.06-py3
          command: ["bash", "-c", "eval \"$ORX_SCRIPT\""]
          resources:
            requests:
              nvidia.com/gpu: "4"
              cpu: "24"
              memory: "128Gi"
            limits:
              nvidia.com/gpu: "4"
              memory: "192Gi"
